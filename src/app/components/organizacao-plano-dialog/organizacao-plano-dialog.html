<p-dialog
  [header]="titulo"
  [(visible)]="visible"
  [modal]="true"
  [style]="{ width: '720px', maxWidth: '95vw' }"
  (onShow)="onShow()"
  (onHide)="onHide()"
>
  <div *ngIf="!loading; else loadingTpl" class="flex flex-col gap-4">
    <div>
      <label class="block mb-2 font-medium">Plano contratado</label>
      <p-select
        [options]="planos"
        optionLabel="name"
        optionValue="code"
        [(ngModel)]="idPlanoSelecionado"
        [ngModelOptions]="{ standalone: true }"
        placeholder="Selecione o plano"
        styleClass="w-full"
      />
    </div>

    <div *ngIf="statusAssinatura" class="text-sm text-muted-color">
      Status da assinatura: <strong>{{ statusAssinatura }}</strong>
    </div>

    <div *ngIf="utilizacao">
      <h4 class="font-medium mb-2">Utilização vs. limites</h4>
      <p-table [value]="utilizacao.limites">
        <ng-template pTemplate="header">
          <tr>
            <th>Limite</th>
            <th>Consumo</th>
            <th>Máximo</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-limite>
          <tr>
            <td>{{ limite.nmLimite }}</td>
            <td>{{ limite.nuConsumo }}</td>
            <td>{{ limite.nuValor == null ? 'Ilimitado' : limite.nuValor }}</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <ng-template #loadingTpl>
    <p class="text-center py-4">Carregando...</p>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton type="button" label="Fechar" class="p-button-text" (click)="onHide()"></button>
    <button
      pButton
      type="button"
      label="Alterar plano"
      icon="pi pi-check"
      [loading]="saving"
      (click)="alterarPlano()"
    ></button>
  </ng-template>
</p-dialog>
