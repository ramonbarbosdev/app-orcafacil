<p-dialog header="Selecione" [modal]="true" [(visible)]="visible" [style]="{ width: '25rem' }" (onHide)="hideDialog()"
  (onShow)="showDialog()">
  <div class="flex-row-responsive">
    <app-layout-campo [label]="'Organização:'" [width]="'w-full'" [sublabel]="'Informe a organização'"
      [describedby]="'idOrganizacao'">
      <p-select [checkmark]="true" [showClear]="true" name="idOrganizacao" [options]="listaEmpresa" optionLabel="name"
        optionValue="code" placeholder="Organizações" class="w-full" [(ngModel)]="objeto.idOrganizacao" />
    </app-layout-campo>
  </div>

  <div class="flex justify-end gap-2">
    <p-button label="Continuar" (click)="continuar()" [loading]="loading" />
  </div>
</p-dialog>
