<div class="flex flex-col gap-4">

    <!-- TOTAL -->
    <div class="resumo-card">
        <div class="flex justify-between items-center">
            <span class="text-sm text-gray-400">Total atual</span>
            <span class="text-lg font-semibold text-emerald-400">
                {{ totalAtual | currency:'BRL' }}
            </span>

        </div>
    </div>

    <div class="flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
        <input pInputText type="text" class="w-full md:w-6/12" placeholder="Pesquisar ajuste..."
            [(ngModel)]="termoBusca" (ngModelChange)="onBuscar()" />

        <span class="text-xs text-gray-400">
            {{ camposFiltrados.length }} encontrados
        </span>
    </div>

    <div class="ajuste-scroll">

        <div class="flex flex-col gap-4">

            <div *ngFor="let campo of camposPaginados"    class="ajuste-card p-4 rounded-xl bg-zinc-900/50 border border-zinc-800">
             

                <!-- NOME -->
                <div class="mb-2">
                    <span class="text-sm font-medium text-zinc-200">
                        {{ campo.nmCampoPersonalizado }}
                    </span>

                    <span class="text-xs text-gray-400">
                        {{'Ajuste manual' }}
                    </span>
                </div>

                <!-- LINHA INPUT -->
                <div class="flex gap-3 items-center">

                    <!-- VALOR -->
                    <div class="w-1/3">
                        <p-inputNumber [ngModel]="uiValores[campo.idCampoPersonalizado]?.valor"
                            (onInput)="setValor(campo.idCampoPersonalizado, $event.value)" mode="currency" currency="BRL"
                            locale="pt-BR" [min]="0" class="w-full">
                        </p-inputNumber>
                    </div>

                    <div class="flex-1">
                        <textarea pTextarea placeholder="Descrição do material" rows="1" class="w-full text-sm"
                            [ngModel]="uiValores[campo.idCampoPersonalizado]?.descricao"
                            (ngModelChange)="setDescricao(campo.idCampoPersonalizado, $event)" maxlength="255">
</textarea>

                    </div>
                </div>



            </div>

        </div>

    </div>

    <p-paginator [first]="first" [rows]="rows" [totalRecords]="camposFiltrados.length"
        [rowsPerPageOptions]="rowsPerPageOptions" (onPageChange)="onPageChange($event)">
    </p-paginator>
</div>
