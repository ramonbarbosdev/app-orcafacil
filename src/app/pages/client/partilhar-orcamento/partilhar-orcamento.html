<p-dialog header="Partilhar" [modal]="true" [(visible)]="visible" [style]="{ width: '42rem' }" (onHide)="hideDialog()"
    (onShow)="showDialog()">

    <div class="flex flex-col gap-6 relative">

        @if (gerandoPdf) {
            <div class="partilhar-pdf-loading absolute inset-0 z-10 flex flex-col items-center justify-center gap-3 rounded-lg">
                <p-progressSpinner strokeWidth="4" styleClass="w-10 h-10" />
                <p class="text-sm font-medium m-0">Gerando PDF do orçamento...</p>
                <p class="text-xs text-surface-500 m-0">Isso pode levar alguns segundos</p>
            </div>
        }

        <p class="text-sm">
            O orçamento foi gerado com sucesso. Escolha como deseja compartilhá-lo com o cliente.
        </p>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

            <!-- WhatsApp -->
            <p-button variant="text" type="button" severity="secondary" (click)="enviarWhatsApp()">
                <div class="flex flex-col items-center gap-2 p-3 rounded-xl transition">
                    <div class="w-14 h-14 rounded-full bg-green-500 flex items-center justify-center">
                        <i class="pi pi-whatsapp text-white text-2xl"></i>
                    </div>
                    <span class="text-sm ">WhatsApp</span>
                </div>
            </p-button>

            <p-button variant="text" type="button" severity="secondary" (click)="enviarEmail()">
                <div class="flex flex-col items-center gap-2 p-3 rounded-xl transition">
                    <div class="w-14 h-14 rounded-full bg-blue-500 flex items-center justify-center">
                        <i class="pi pi-envelope text-white text-2xl"></i>
                    </div>
                    <span class="text-sm ">E-mail</span>
                </div>
            </p-button>

            <!-- Copiar link -->
            <p-button variant="text" type="button" severity="secondary" (click)="abrirView()">
                <div class="flex flex-col items-center gap-2 p-3 rounded-xl transition">

                    <div class="w-14 h-14 rounded-full bg-gray-700 flex items-center justify-center">
                        <i class="pi pi-link text-white text-2xl"></i>
                    </div>
                    <span class="text-sm">Visualizar</span>

                </div>

            </p-button>

            <!-- PDF -->
            <p-button
                variant="text"
                type="button"
                severity="secondary"
                [loading]="gerandoPdf"
                [disabled]="gerandoPdf"
                (click)="gerarPdf()"
            >
                <div class="flex flex-col items-center gap-2 p-3 rounded-xl transition">

                    <div class="w-14 h-14 rounded-full bg-red-500 flex items-center justify-center">
                        <i class="pi pi-file-pdf text-white text-2xl"></i>
                    </div>
                    <span class="text-sm ">Gerar PDF</span>
                </div>

            </p-button>

        </div>


        <p-divider />


        <div class="flex items-center gap-2">
            <input type="text" pInputText [value]="linkOrcamento" readonly class="w-full text-sm" />

            <button pButton type="button" icon="pi pi-copy" class="p-button-outlined" (click)="copiarLink()">
            </button>
        </div>



    </div>

</p-dialog>
