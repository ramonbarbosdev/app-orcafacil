<app-layout-form-simples
  [(visible)]="isDialog"
  [title]="titulo"
  [loading]="loading"
  (save)="onSave()"
  (cancel)="hideDialog()"
  (show)="onShow()"
>
  <p class="text-color-secondary mb-4 text-sm" *ngIf="!isEdicao">
    Informe o CPF e clique em <strong>Buscar</strong>. Se o usuário já existir no sistema, basta escolher o perfil
  para vinculá-lo à organização. Senha só é obrigatória para cadastrar alguém novo.
  </p>
  <p class="text-color-secondary mb-4 text-sm" *ngIf="isEdicao">
    Altere nome, perfil ou senha. Deixe a senha em branco para mantê-la.
  </p>

  <div class="flex-row-responsive" *ngIf="!isEdicao">
    <app-layout-campo
      [error]="errorValidacao['nuCpf']"
      [label]="'CPF: (*)'"
      [width]="'md:w-8/12'"
      [sublabel]="'CPF do usuário (11 dígitos)'"
      [describedby]="'nuCpf'"
    >
      <input
        title="nuCpf"
        pInputText
        id="nuCpf"
        name="nuCpf"
        class="w-full"
        placeholder="000.000.000-00"
        [(ngModel)]="objeto.nuCpf"
        (ngModelChange)="onCpfChange()"
        mask="000.000.000-00"
        [ngClass]="{ 'ng-dirty ng-invalid': errorValidacao['nuCpf'] }"
      />
    </app-layout-campo>

    <app-layout-campo [label]="' '" [width]="'md:w-4/12'" [sublabel]="' '">
      <button
        pButton
        type="button"
        label="Buscar"
        icon="pi pi-search"
        class="w-full mt-2"
        [loading]="buscandoCpf"
        (click)="buscarPorCpf()"
      ></button>
    </app-layout-campo>
  </div>

  <p-message
    *ngIf="!isEdicao && usuarioExistente"
    severity="info"
    class="mb-3 block w-full"
    text="Usuário encontrado. Ele será vinculado a esta organização. A senha atual será mantida se você deixar o campo em branco."
  />

  <p-message
    *ngIf="!isEdicao && cpfInformadoCompleto && !usuarioExistente && !buscandoCpf"
    severity="secondary"
    class="mb-3 block w-full"
    text="Usuário não encontrado. Preencha os dados para cadastrar e vincular."
  />

  <div class="flex-row-responsive" *ngIf="isEdicao">
    <app-layout-campo [label]="'CPF:'" [width]="'md:w-6/12'" [sublabel]="'Não editável'">
      <input title="nuCpf" pInputText class="w-full" [value]="objeto.nuCpf" disabled />
    </app-layout-campo>
  </div>

  <div class="flex-row-responsive">
    <app-layout-campo
      [error]="errorValidacao['nmUsuario']"
      [label]="'Nome: (*)'"
      [width]="'md:w-6/12'"
      [sublabel]="'Nome completo do usuário'"
      [describedby]="'nmUsuario'"
    >
      <input
        title="nmUsuario"
        pInputText
        id="nmUsuario"
        name="nmUsuario"
        class="w-full"
        [(ngModel)]="objeto.nmUsuario"
        [ngClass]="{ 'ng-dirty ng-invalid': errorValidacao['nmUsuario'] }"
      />
    </app-layout-campo>

    <app-layout-campo
      [error]="errorValidacao['dsSenha']"
      [label]="isEdicao || usuarioExistente ? 'Nova senha:' : 'Senha: (*)'"
      [width]="'md:w-6/12'"
      [sublabel]="
        isEdicao || usuarioExistente
          ? 'Opcional — em branco mantém a atual'
          : 'Senha de acesso ao sistema'
      "
      [describedby]="'dsSenha'"
    >
      <p-password
        name="dsSenha"
        id="dsSenha"
        [(ngModel)]="objeto.dsSenha"
        placeholder="Senha"
        [toggleMask]="true"
        [fluid]="true"
        [feedback]="false"
        [ngClass]="{ 'ng-dirty ng-invalid': errorValidacao['dsSenha'] }"
      ></p-password>
    </app-layout-campo>
  </div>

  <div class="flex-row-responsive">
    <app-layout-campo
      [error]="errorValidacao['dsRole']"
      [label]="'Perfil na organização: (*)'"
      [width]="'md:w-6/12'"
      [sublabel]="'ADMIN ou USER'"
      [describedby]="'dsRole'"
    >
      <p-select
        [checkmark]="true"
        name="dsRole"
        [options]="listaRoles"
        optionLabel="name"
        optionValue="code"
        placeholder="Selecione"
        class="w-full"
        [(ngModel)]="objeto.dsRole"
        [ngClass]="{ 'ng-dirty ng-invalid': errorValidacao['dsRole'] }"
      />
    </app-layout-campo>
  </div>
</app-layout-form-simples>
